<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RideShare Simulator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>RideShare Simulator</h1>
        
        <div class="form">
            <input type="text" id="pickup" placeholder="Pickup location">
            <input type="text" id="dropoff" placeholder="Drop-off location">
            <button onclick="requestRide()">Request Ride</button>
        </div>

        <div id="response"></div>

        <div class="buttons">
            <button onclick="viewHistory()">View Trip History</button>
            <button onclick="cancelTrip()">Cancel Trip</button>
        </div>

        <div id="history"></div>
    </div>

    <script>
        let lastTripId = null;

        function requestRide() {
            const pickup = document.getElementById('pickup').value;
            const dropoff = document.getElementById('dropoff').value;

            fetch('/request_ride', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({pickup, dropoff})
            })
            .then(res => res.json())
            .then(data => {
                if(data.success){
                    lastTripId = data.trip_id;
                    document.getElementById('response').innerHTML = 
                        `Driver ${data.driver} assigned! ETA: ${data.eta} mins.`;
                } else {
                    document.getElementById('response').innerHTML = data.message;
                }
            });
        }

        function viewHistory() {
            fetch('/view_history')
            .then(res => res.json())
            .then(data => {
                let html = '<h3>Trip History</h3><ul>';
                data.forEach(trip => {
                    html += `<li>Trip ${trip.trip_id}: Rider ${trip.rider}, Driver ${trip.driver}, ` +
                            `${trip.pickup} → ${trip.dropoff}, State: ${trip.state}</li>`;
                });
                html += '</ul>';
                document.getElementById('history').innerHTML = html;
            });
        }

        function cancelTrip() {
            if(!lastTripId) { alert("No trip to cancel!"); return; }

            fetch('/cancel_trip', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({trip_id: lastTripId})
            })
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    alert("Trip cancelled!");
                    viewHistory();
                } else {
                    alert(data.message);
                }
            });
        }
    </script>
</body>
</html>
